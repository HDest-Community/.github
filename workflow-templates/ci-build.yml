name: CI Build

on:
  push:
    branches:
      - $default-branch

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4
      - uses: HDest-Community/.github/workflows/build-pk3@main
        with:
          # Uncomment the following if you wish to change the base PK3 name
          # name: ChangeMe
          suffix: ${{ github.ref_name }}-$(date +'%Y%m%d')
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./*.pk3
