name: Build PK3
description: Builds the PK3

inputs:
  name:
    description: The base name of the PK3 being built.  For example, a mod_name of "MyCoolMod" would result in a built file named "MyCoolMod-suffix.pk3".
    required: false
    type: string
    default: ${{ github.event.repository.name }}
  suffix:
    description: The specific identifier added onto the resulting PK3.  For example, a suffix of "v1.2.3" would result in a built file named "MyCoolMod-v1.2.3.pk3".
    required: false
    type: string
    default: ${{ github.ref_name }}-$(date +'%Y%m%d')

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: HDest-Community/.github/workflows/build-pk3@main
      with:
        name: ${{ inputs.name }}
        suffix: ${{ inputs.suffix }}
    - uses: actions/upload-artifact@v4
      with:
        path: ${{ inputs.name }}-${{ inputs.suffix }}.pk3
        archive: false
